{% extends 'baseLibrarian.html' %}

{% load crispy_forms_tags %}

{% block title %}Add A New Book | GardenBook{% endblock %}

{% block page %}Add A New Book{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card rounded-20 shadow-sm">
        <div class="card-header bg-white">
          <h5 class="card-title mb-0">
            <i class="bi bi-book-half me-2 text-brown"></i>
            Book Information Form
          </h5>
        </div>
        <div class="card-body">
          <form method="POST" enctype="multipart/form-data" class="needs-validation">
            {% csrf_token %}
            {% crispy form %}
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
