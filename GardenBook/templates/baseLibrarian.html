{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="{% static 'assets/dist/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="icon" type="image/png" href="{% static 'assets/brand/logo-white-rbg.png' %}">

  <title>{% block title %}Librarian Base page{% endblock %}</title>
</head>

<body>
  <div class="layout-container">
    <!-- Fixed Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <!-- Logo -->
        <div class="text-center mb-5">
          <a href="{% url 'dashboard' %}"
            class="d-flex align-items-center justify-content-center text-brown text-decoration-none">
            <img src="{% static 'assets/brand/_logo-nobg.png' %}" class="img-fluid" width="90" height="90" role="img"
              alt="Library Management System">
          </a>
        </div>

        <!-- Navigation Links -->
        <nav class="sidebar-nav">
          <ul class="list-unstyled ps-2">
            <li class="nav-item mb-3">
              <a href="{% url 'dashboard' %}"
                class="sidebar-link d-flex align-items-center {% if request.path == '/dashboard/' %}active-link{% endif %}">
                <i class="bi bi-clipboard2-data me-3"></i>
                <span>Dashboard</span>
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="{% url 'manage-users' %}"
                class="sidebar-link d-flex align-items-center {% if request.path == '/manage-users/' %}active-link{% endif %}">
                <i class="bi bi-people me-3"></i>
                <span>Manage Users</span>
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="{% url 'borrows-returns' %}"
                class="sidebar-link d-flex align-items-center {% if request.path == '/borrows-returns/' %}active-link{% endif %}">
                <i class="bi bi-ui-checks me-3"></i>
                <span>Borrows & Returns</span>
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="{% url 'stock' %}"
                class="sidebar-link d-flex align-items-center {% if request.path == '/stock/' %}active-link{% endif %}">
                <i class="bi bi-archive me-3"></i>
                <span>Stock</span>
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="{% url 'orders' %}"
                class="sidebar-link d-flex align-items-center {% if request.path == '/orders/' %}active-link{% endif %}">
                <i class="bi bi-bag-dash me-3"></i>
                <span>Orders</span>
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="{% url 'manage-event' %}"
                class="sidebar-link d-flex align-items-center {% if request.path == '/manage-event/' %}active-link{% endif %}">
                <i class="bi bi-calendar2-event me-3"></i>
                <span>Events</span>
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="{% url 'manage-payment' %}"
                class="sidebar-link d-flex align-items-center {% if request.path == '/manage-payment/' %}active-link{% endif %}">
                <i class="bi bi-wallet2 me-3"></i>
                <span>Payments</span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Logout at Bottom -->
        <div class="mt-auto">
          <a href="{% url 'logout' %}" class="logout-link d-flex align-items-center">
            <i class="bi bi-box-arrow-left me-3"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="main-header">
        <button class="sidebar-toggle">
          <i class="bi bi-list"></i>
        </button>

        <div class="header-title">
          <h4 class="mb-0">{% block page %}Dashboard{% endblock %}</h4>
        </div>

        <div class="profile-img-container">
          <!-- Notifications or other header elements -->
          <a href="{% url 'dashboard' %}">
            <img
              src="{% if request.user.profile_pic %}{{ request.user.profile_pic.url }}{% else %}{% static 'profile_pic2.png' %}{% endif %}"
              alt="Profile" class="profile-img">
          </a>
        </div>
      </div>

      <!-- Scrollable Content Area -->
      <div class="content-area">
        {% block content %}
        {% endblock content %}
      </div>
    </main>
  </div>

  <script src="{% static 'assets/dist/js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
